# go-get-a-job example configuration.
#
# This is a TEMPLATE, and it describes a generic "Go developer" persona - it
# is not anybody's real search. Copy it, edit it for your own companies and
# preferences, and mount it into the container at the path passed via
# --config.
#
# Keep your real config in a PRIVATE repository (your own GitOps repo, or a
# Kubernetes Secret) rather than in a fork of this one. Your profile text is
# a fairly complete picture of what you are looking for, where you live, and
# what you will not accept; that is not something to publish.
#
# Nothing sensitive belongs in here either way: API keys and tokens are read
# from environment variables (populated from a Kubernetes Secret), never
# from this file.
#
# See deploy/configmap.example.yaml for an example of the same document
# wrapped in a ConfigMap.

sources:
  # Greenhouse, Lever, Ashby, and SmartRecruiters all expose free public
  # JSON job-board APIs keyed by a company "board token"/slug — just the
  # part of the company's own careers URL that identifies them. Find it by
  # opening the company's careers page and looking at the URL, e.g.
  # https://job-boards.greenhouse.io/grafanalabs -> company: grafanalabs
  - type: greenhouse
    company: grafanalabs
    displayName: "Grafana Labs"
  - type: greenhouse
    company: gitlab
    displayName: "GitLab"

  # HashiCorp and Atlassian used to be listed here; both are unreachable
  # with any connector this project has, and in practice only ever
  # produced one "source fetch failed" log line per run:
  #   - HashiCorp: its Greenhouse board ("hashicorp") has been retired -
  #     boards.greenhouse.io/hashicorp now 301s to a 404. HashiCorp hires
  #     through IBM's careers site, which exposes no public JSON API this
  #     project can read.
  #   - Atlassian: their Workday tenant (atlassian.wd5.myworkdayjobs.com,
  #     also reachable as atlassian.wd3) answers every anonymous
  #     /wday/cxs/... request with 401 "Unable to verify credentials for
  #     system account", for every site slug - so it is not scrapeable the
  #     way a normal public Workday board is.
  # See "Verifying a board before you add it" in the README before adding
  # a company here: a wrong board fails per-run rather than loudly.

  # Workday has no single well-known API host, but the request shape is
  # the same for every Workday customer that allows anonymous reads. To
  # onboard a new Workday company:
  #   1. Open the company's real careers site in a browser with devtools
  #      open (Network tab).
  #   2. Search for any job title; find the XHR request to a URL like
  #      https://<tenant>.wd###.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs
  #   3. host   = the full hostname from that URL
  #      tenant = the path segment right after /wday/cxs/
  #      site   = the path segment right after tenant (case-sensitive)
  # The values below are NVIDIA's real, verified-working board (a 200 with
  # a populated jobPostings array) - uncomment them to watch NVIDIA, or
  # replace them with your own tenant/site from step 2.
  # - type: workday
  #   tenant: nvidia
  #   host: nvidia.wd5.myworkdayjobs.com
  #   site: NVIDIAExternalCareerSite
  #   displayName: "NVIDIA"

  # Not covered in v1 (no simple public API; would need bespoke/fragile
  # scraping): Google (careers.google.com is a custom platform), SAP
  # (SuccessFactors public job search has no open JSON endpoint), Apple
  # (jobs.apple.com is a custom platform). Left here, commented out, as
  # placeholders in case connectors are added later.
  # - type: custom
  #   displayName: "Google"
  # - type: custom
  #   displayName: "SAP"
  # - type: custom
  #   displayName: "Apple"

filter:
  # Recall gate: a job's title+description must match at least one of these
  # (case-insensitive, OR-matched) before it's ever sent to the AI scorer.
  # Keep this broad - it exists to skip obviously-irrelevant postings cheaply,
  # so list every adjacent job title you'd consider (here: "sre", "site
  # reliability", "devops"), not just the one you'd ideally take. How much you
  # want each of them is what `ai.profile` below is for.
  keywords:
    - "go developer"
    - "golang"
    - "backend engineer"
    - "software engineer"
    - "distributed systems"
    - "kubernetes"
    - "grpc"
    - "api"

  # Where you are legally able to work. This is a whitelist: naming a place
  # here is what sends a posting to the AI scorer, and a location that names
  # any other place is dropped before it costs an AI call. There is no `deny`
  # list, so nothing has to be kept in sync when a new country shows up.
  #
  # Matching is case-insensitive and word-boundary aware ("US" matches
  # "Austin, US" but not "Australia"), and entries are phrases ("European
  # Union", "EMEA"). Country and region names only - do not list remote
  # phrasings here, see below.
  locations:
    # Leave `accept` empty ([]) to skip location filtering entirely.
    accept:
      - "Germany"
      - "EMEA"
      - "European Union"
    # What to do with a location that names a real place you have not
    # accepted: "reject" (the default) drops it before it reaches the AI
    # scorer, "pass" sends it to the scorer as well. "reject" is the right
    # default because remote and unlabelled locations never land here - only
    # an actual unaccepted country does.
    #
    # Locations that say nothing about a country do not reach this setting.
    # An empty location, a remote phrasing in any wording ("remote",
    # "worldwide", "anywhere", "home office", "work from home",
    # "ortsunabhängig", ...), and filler values like "N/A" all go to the AI
    # scorer, which judges them against `ai.profile` and `ai.instructions`.
    # That is deliberate: the set of phrasings a portal might use for
    # "anywhere" is not enumerable, and the pre-filter must not guess.
    unmatched: reject

  # 0-1 relevance score threshold (from the AI scorer) required to trigger
  # a notification.
  minAIScore: 0.7

ai:
  provider: deepseek
  # Name of the environment variable holding the DeepSeek API key. The key
  # itself comes from a Kubernetes Secret at deploy time, never from this
  # file.
  apiKeyEnv: DEEPSEEK_API_KEY
  # Must be an absolute https URL with no userinfo, query string, or fragment:
  # this value and the API key travel together, so it is validated at startup
  # (see the security section of the README for why).
  baseURL: https://api.deepseek.com
  model: deepseek-chat

  # Free-text description of what you're looking for. Sent verbatim to the
  # model alongside each candidate job — edit this any time to change what
  # counts as a match, no code changes required.
  #
  # This is the precision lever, and the place to say which of the
  # `filter.keywords` titles you actually want most. The scorer's prompt
  # already discounts generic matches, so "platform engineering roles
  # primarily, SRE for extra coverage" belongs here rather than in a ranked
  # keyword list.
  profile: |
    Backend / platform engineer looking for Go-focused roles: services and
    APIs, distributed systems, and Kubernetes-adjacent infrastructure work.
    Especially interested in developer tools, observability, and
    data-intensive systems. Open to remote roles, or onsite/hybrid in
    Germany or elsewhere in the EU.

  # Optional extra rules for the scorer, appended to the fixed scoring
  # prompt. Use this for hard constraints that would clutter the profile -
  # above all legal-location ones. The pre-filter above only decides whether a
  # posting names an accepted country; where a remote posting may legally be
  # based is a judgment call, and this is where you make it.
  #
  # This text is TRUSTED OPERATOR TEXT. It is added to the system prompt
  # rather than to the untrusted, fenced-off posting, so anything pasted here
  # is obeyed. Never copy text out of a job posting into it.
  #instructions: |
  #  Treat "Remote - <country>" exactly like an onsite role in that country.
  #  A role that is remote globally, or workable from Germany, is fine. If a
  #  posting requires being legally based outside Germany or requires
  #  relocation, score it 0.2 or below.

notify:
  type: ntfy
  ntfy:
    # Must be https for any host outside the cluster. Plain http is accepted
    # only for *.svc / *.svc.cluster.local / *.cluster.local / localhost /
    # loopback IPs, so the in-cluster hop below is allowed but a remote one
    # cannot silently be downgraded - this URL receives the bearer token from
    # tokenEnv on every publish.
    url: http://ntfy.go-get-a-job.svc.cluster.local
    topic: job-matches
    # Optional: name of the environment variable holding an ntfy access
    # token, if your topic/server requires auth (recommended). Create it as a
    # non-admin user with access to just this topic - see the README.
    tokenEnv: NTFY_TOKEN

store:
  type: sqlite
  path: /data/go-get-a-job.db

# Limits and failure alerts. Everything here is optional: omit the whole block,
# or any key in it, and the defaults below apply.
guard:
  # How many consecutive successful runs a source may return zero postings
  # before you get a warning, and how often that warning repeats while the
  # source stays silent. Default: 14.
  #
  # This is a "the board is broken" detector, not a "this company is not
  # hiring" detector - and from a response those look identical. A company with
  # three open roles legitimately has none for weeks, so a short threshold
  # would fire constantly and teach you to ignore the one alert that matters.
  #
  # The failures it catches: a board slug that was renamed or moved to another
  # ATS, an API that changed shape, a company that stopped publishing where it
  # used to. SmartRecruiters is the sharp case - it answers *any* slug with
  # "200, no postings", so a typo there is otherwise perfectly silent.
  #
  # A source that returns postings resets the count, and a source that errors
  # is never counted here (that is reported as an error instead).
  #
  # To turn the warning off, set this high enough that it never fires (e.g.
  # 3650). A negative value is rejected rather than silently ignored.
  deadSourceRuns: 14

  # Floor between two outbound requests, in whole milliseconds. Default: 250.
  # Global, not per host.
  #
  # Raise this if you watch a lot of boards and want to be gentler; the
  # requests go to other people's infrastructure, published for browsers
  # rather than for a polling client. Lowering it makes the tool worse, not
  # faster: a full run of 40 boards is already a few thousand requests.
  minRequestIntervalMs: 250

  # Hard cap on outbound requests in one run. Default: 10000.
  #
  # This catches a pagination loop rather than enforcing a rate - reaching it
  # means a bug, not a busy day. It is also the budget for the whole process,
  # shared across every source, so a config with 50 companies does not get 50
  # times the intended ceiling.
  maxRequestsPerRun: 10000
