# go-get-a-job example configuration.
#
# Copy this file, edit it for your own companies/preferences, and mount it
# into the container at the path passed via --config (see deploy/configmap.yaml).
# Nothing sensitive belongs in here — API keys and tokens are read from
# environment variables (populated from a Kubernetes Secret), never from
# this file.

sources:
  # Greenhouse, Lever, Ashby, and SmartRecruiters all expose free public
  # JSON job-board APIs keyed by a company "board token"/slug — just the
  # part of the company's own careers URL that identifies them. Find it by
  # opening the company's careers page and looking at the URL, e.g.
  # https://job-boards.greenhouse.io/grafanalabs -> company: grafanalabs
  - type: greenhouse
    company: grafanalabs
    displayName: "Grafana Labs"
  - type: greenhouse
    company: gitlab
    displayName: "GitLab"

  # HashiCorp and Atlassian used to be listed here; both are unreachable
  # with any connector this project has, and in practice only ever
  # produced one "source fetch failed" log line per run:
  #   - HashiCorp: its Greenhouse board ("hashicorp") has been retired -
  #     boards.greenhouse.io/hashicorp now 301s to a 404. HashiCorp hires
  #     through IBM's careers site, which exposes no public JSON API this
  #     project can read.
  #   - Atlassian: their Workday tenant (atlassian.wd5.myworkdayjobs.com,
  #     also reachable as atlassian.wd3) answers every anonymous
  #     /wday/cxs/... request with 401 "Unable to verify credentials for
  #     system account", for every site slug - so it is not scrapeable the
  #     way a normal public Workday board is.
  # See "Verifying a board before you add it" in the README before adding
  # a company here: a wrong board fails per-run rather than loudly.

  # Workday has no single well-known API host, but the request shape is
  # the same for every Workday customer that allows anonymous reads. To
  # onboard a new Workday company:
  #   1. Open the company's real careers site in a browser with devtools
  #      open (Network tab).
  #   2. Search for any job title; find the XHR request to a URL like
  #      https://<tenant>.wd###.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs
  #   3. host   = the full hostname from that URL
  #      tenant = the path segment right after /wday/cxs/
  #      site   = the path segment right after tenant (case-sensitive)
  # The values below are NVIDIA's real, verified-working board (a 200 with
  # a populated jobPostings array) - uncomment them to watch NVIDIA, or
  # replace them with your own tenant/site from step 2.
  # - type: workday
  #   tenant: nvidia
  #   host: nvidia.wd5.myworkdayjobs.com
  #   site: NVIDIAExternalCareerSite
  #   displayName: "NVIDIA"

  # Not covered in v1 (no simple public API; would need bespoke/fragile
  # scraping): Google (careers.google.com is a custom platform), SAP
  # (SuccessFactors public job search has no open JSON endpoint), Apple
  # (jobs.apple.com is a custom platform). Left here, commented out, as
  # placeholders in case connectors are added later.
  # - type: custom
  #   displayName: "Google"
  # - type: custom
  #   displayName: "SAP"
  # - type: custom
  #   displayName: "Apple"

filter:
  # Cheap pre-filter: a job's title+description must match at least one of
  # these (case-insensitive) before it's ever sent to the AI scorer. Keep
  # this broad — it's just here to skip obviously-irrelevant postings
  # cheaply; the AI profile below does the real relevance judgment.
  keywords:
    - "platform engineer"
    - "platform engineering"
    - "devops"
    - "site reliability"
    - "infrastructure engineer"
    - "cloud engineer"
    - "crossplane"
    - "terraform"
    - "kubernetes"
    - "sre"

  # Optional allow-list of location substrings. Leave empty ([]) to disable
  # location filtering entirely.
  locations:
    - "Germany"
    - "Remote"
    - "EMEA"

  # 0-1 relevance score threshold (from the AI scorer) required to trigger
  # a notification.
  minAIScore: 0.7

ai:
  provider: deepseek
  # Name of the environment variable holding the DeepSeek API key. The key
  # itself comes from a Kubernetes Secret at deploy time, never from this
  # file.
  apiKeyEnv: DEEPSEEK_API_KEY
  # Must be an absolute https URL with no userinfo, query string, or fragment:
  # this value and the API key travel together, so it is validated at startup
  # (see the security section of the README for why).
  baseURL: https://api.deepseek.com
  model: deepseek-chat

  # Free-text description of what you're looking for. Sent verbatim to the
  # model alongside each candidate job — edit this any time to change what
  # counts as a match, no code changes required.
  profile: |
    Platform/DevOps/SRE engineer based in Germany looking for roles centered
    on Infrastructure-as-Code / Infrastructure-as-Data, especially
    Crossplane, Terraform, Pulumi, or Kubernetes operators/controllers.
    Open to remote or Germany/EU-based roles. Especially interested in
    developer-tools, observability, and cloud-infrastructure companies.

notify:
  type: ntfy
  ntfy:
    # Must be https for any host outside the cluster. Plain http is accepted
    # only for *.svc / *.svc.cluster.local / *.cluster.local / localhost /
    # loopback IPs, so the in-cluster hop below is allowed but a remote one
    # cannot silently be downgraded - this URL receives the bearer token from
    # tokenEnv on every publish.
    url: http://ntfy.go-get-a-job.svc.cluster.local
    topic: job-matches
    # Optional: name of the environment variable holding an ntfy access
    # token, if your topic/server requires auth (recommended). Create it as a
    # non-admin user with access to just this topic - see the README.
    tokenEnv: NTFY_TOKEN

store:
  type: sqlite
  path: /data/go-get-a-job.db
