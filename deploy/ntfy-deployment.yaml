# Self-hosted ntfy server, in-cluster only by default (ClusterIP - see
# ntfy-service.yaml). To receive push notifications away from your home
# network, add a hostname for this Service to your existing reverse-proxy
# setup and update base-url in ntfy-configmap.yaml accordingly; nothing
# here needs to change to support that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: go-get-a-job
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate # avoid two pods fighting over the same RWO volume during rollout
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          args: ["serve"]
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: tmp
          emptyDir: {}
