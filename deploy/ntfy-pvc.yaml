# Holds ntfy's own cache and auth (user/token) databases, so they survive
# pod restarts. Block storage (Longhorn), matching the reasoning in
# ../pvc.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: go-get-a-job
  annotations:
    # Per homecluster's own docs/gitops.md: protects this volume (and its
    # data - your ntfy user/token database) if the ArgoCD Application is
    # ever deleted/pruned from git.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
