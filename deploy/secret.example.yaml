# Template for the real secret, which is NOT committed (deploy/secret.yaml
# is git-ignored - see .gitignore). Copy this file to secret.yaml, fill in
# real values, and apply it once with:
#
#   kubectl apply -f deploy/secret.yaml
#
# DEEPSEEK_API_KEY: your DeepSeek API key (https://platform.deepseek.com).
# NTFY_TOKEN: an access token for the self-hosted ntfy instance, created
#             once via `ntfy token add <user>` - see README for the full
#             one-time ntfy setup steps.
apiVersion: v1
kind: Secret
metadata:
  name: go-get-a-job-secrets
  namespace: go-get-a-job
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "replace-me"
  NTFY_TOKEN: "replace-me"
