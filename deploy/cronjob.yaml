# Runs one fetch-filter-score-notify pass per schedule tick. Adjust
# `schedule` freely - jobs typically stay open for weeks, so once/day is a
# reasonable starting point; there's no need to poll more often unless you
# want tighter latency on "brand new posting" notifications.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: go-get-a-job
  namespace: go-get-a-job
spec:
  schedule: "0 6 * * *" # daily at 06:00 (cluster timezone)
  concurrencyPolicy: Forbid # never run two passes at once against the same SQLite file
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Generous: a company with an unusually large Workday/SmartRecruiters
      # board needs one detail-fetch HTTP call per open posting (see
      # internal/sources), which can take a few minutes for very large
      # employers.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          # Also selected by the NetworkPolicy in networkpolicy.yaml, so this
          # label is load-bearing: removing or renaming it stops the CronJob
          # from reaching ntfy (and the internet).
          labels:
            app: go-get-a-job
        spec:
          restartPolicy: Never
          # Nothing here talks to the Kubernetes API server, so don't project
          # a service account token into a container that handles untrusted
          # third-party data.
          automountServiceAccountToken: false
          # Matches the distroless "nonroot" base image's fixed UID/GID.
          # fsGroup is required so the mounted PVC is actually writable by
          # that UID - without it, SQLite can't create its database file
          # (verified while building this manifest).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: go-get-a-job
              # Pinned to a release tag *and* a digest so a scheduled run
              # always executes exactly the reviewed image rather than
              # whatever happens to be newest in the registry. The tag
              # mirrors the git tag (see .github/workflows/docker-build.yml);
              # bump both values deliberately when cutting a release (see
              # README) - the old digest is the rollback. v0.1.0 is the one
              # release published before that convention, as "0.1.0".
              image: ghcr.io/erik-schuetze/go-get-a-job:0.1.0@sha256:d1fff42c2a01492973234af251402b9e35399cfe48c723e0d3d1601a727b49af
              imagePullPolicy: IfNotPresent
              args: ["--config", "/etc/go-get-a-job/config.yaml"]
              envFrom:
                - secretRef:
                    name: go-get-a-job-secrets
              volumeMounts:
                - name: config
                  mountPath: /etc/go-get-a-job
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: config
              configMap:
                name: go-get-a-job-config
            - name: data
              persistentVolumeClaim:
                claimName: go-get-a-job-data
            - name: tmp
              emptyDir: {}
