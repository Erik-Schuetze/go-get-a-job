name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Least privilege for the whole workflow; the job that actually pushes adds
# the one permission it needs on top of this.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # No explicit permissions before this: the job inherited the repository
    # default, which for older repositories is read/write. Nothing here
    # touches the API, so it gets the same read-only pair as the workflow.
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs. A tag such as @v4 is a
      # mutable ref that the action's owners (or anyone who compromises
      # their account) can repoint at new code, which would then run here
      # with this workflow's token. The trailing comment records which
      # release the SHA corresponds to, and Dependabot
      # (.github/dependabot.yml) keeps both in sync.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -race

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout's git credential is only needed by steps that push
          # back to the repository; this one doesn't, so it stays out of
          # .git/config where later steps could read it.
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Image tags follow semver and mirror the git tag exactly: tag
          # v0.2.0 publishes v0.2.0. That matters because the manifest is the
          # only place the version is written down, and a reviewer should be
          # able to copy the release name into deploy/cronjob.yaml unchanged.
          # (The default {{version}} pattern would strip the "v", producing a
          # tag that no longer matches the release it came from.)
          #
          # The branch and short-SHA tags are convenience/traceability tags
          # only - they are mutable by definition, so nothing that runs
          # unattended may reference them.
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
